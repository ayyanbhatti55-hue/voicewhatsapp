      - name: Setup Gradle Wrapper Manually
        run: |
          mkdir -p gradle/wrapper
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle-8.7.zip
          unzip -q gradle-8.7.zip
          gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew || true
